<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rightShield" x1="320" y1="0" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pulseGreen" x1="120" y1="320" x2="520" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Left Outer Shield (Navy) -->
  <path d="M 320 70 L 150 135 V 290 C 150 430 320 535 320 535 V 70 Z" fill="#0f172a" stroke="#1e293b" stroke-width="22" stroke-linejoin="round"/>
  
  <!-- Right Outer Shield (Emerald Green) -->
  <path d="M 320 70 L 490 135 V 290 C 490 430 320 535 320 535 V 70 Z" fill="#0f172a" stroke="url(#rightShield)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Inner Dark Shield Cavity -->
  <path d="M 320 115 L 185 168 V 285 C 185 398 320 482 320 482 C 320 482 455 398 455 285 V 168 L 320 115 Z" 
        fill="#090d16" stroke="url(#rightShield)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Heartbeat Pulse Waveform Line -->
  <path d="M 130 310 H 245 L 285 225 L 320 385 L 355 175 L 395 345 L 420 310 H 510" 
        stroke="url(#pulseGreen)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Dot below Pulse -->
